version: '3.8'

services:
  # Time-Series Database for Usage Aggregation
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: metering-timescaledb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: metering_db
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

  # Event Streaming (Redpanda - Kafka Compatible, low overhead)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    container_name: metering-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"

volumes:
  timescale_data: