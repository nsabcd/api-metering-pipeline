server:
  port: 8080

spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      routes:
        - id: event-metering-service
          uri: lb://event-metering-service
          predicates:
            - Path=/api/v1/events/**
  eureka:
    client:
      serviceUrl:
        defaultZone: http://localhost:8761/eureka/