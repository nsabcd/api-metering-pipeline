server:
  port: 8080
rate-limiter:
  enabled: ${RATE_LIMITER_ENABLED:true}
jwt:
  enabled: ${JWT_ENABLED:true}
  secret: defaultSecretKeyForJwtAuthenticationWhichIs32BytesLong!

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      routes:
        - id: event-metering-service
          uri: lb://event-metering-service
          predicates:
            - Path=/api/v1/events/**
          filters:
            - JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@customerKeyResolver}"
  eureka:
    client:
      serviceUrl:
        defaultZone: http://localhost:8761/eureka/