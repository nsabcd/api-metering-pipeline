server:
  port: 8083

spring:
  application:
    name: invoice-generator
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/metering_db
    username: postgres
    password: password
jpa:
  hibernate:
    ddl-auto: update
  show-sql: false

quartz:
  job-store-type: jdbc
  jdbc:
    initialize-schema: ALWAYS # Auto-creates QRTZ_* tables in PostgreSQL
  properties:
    org.quartz.scheduler.instanceName: InvoiceScheduler
    org.quartz.scheduler.instanceId: AUTO
    org.quartz.jobStore.class: org.quartz.impl.jdbcjobstore.JobStoreTX
    org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
    org.quartz.jobStore.useProperties: false
    org.quartz.jobStore.tablePrefix: QRTZ_
    org.quartz.jobStore.isClustered: true # Enables cluster locking across microservice replicas
    org.quartz.jobStore.clusterCheckinInterval: 20000

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/