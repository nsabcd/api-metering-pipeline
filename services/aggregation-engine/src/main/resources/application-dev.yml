server:
  port: 8082

spring:
  application:
    name: aggregation-engine
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/metering_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: validate # Flyway manages schema, JPA only validates
      show-sql: false

  flyway:
      enabled: true
      baseline-on-migrate: true
      locations:
        - classpath:db/migration      # 1. Runs V1
        - classpath:db/dev-migration  # 2. Runs V2 (Dev overrides, seeding, instant refresh)
      out-of-order: true

  kafka:
      bootstrap-servers: localhost:9092
      consumer:
        group-id: aggregation-group
        auto-offset-reset: earliest
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
        properties:
          spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
          spring.json.trusted.packages: "com.metering.*"
          spring.json.value.default.type: com.metering.aggregation.entity.UsageEventEntity
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/