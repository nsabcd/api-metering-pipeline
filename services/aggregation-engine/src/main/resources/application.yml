server:
  port: 8082

spring:
  application:
    name: aggregation-engine
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/metering_db
    username: postgres
    password: password
    jpa:
      hibernate:
        ddl-auto: update
    kafka:
      bootstrap-servers: localhost:9092
      consumer:
        group-id: aggregation-group
        auto-offset-reset: earliest
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/